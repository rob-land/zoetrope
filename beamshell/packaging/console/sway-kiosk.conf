# beamshell console mode — sway kiosk config.
# Used by beamshell-console.service (dedicated VT session, outside GNOME).
# Output setup (disable eDP, pick the XREAL DP mode) happens at runtime in
# beamshell-kiosk.sh, so this same config works for the no-glasses preview test.

xwayland disable
default_border none
default_floating_border none
focus_follows_mouse no
seat * hide_cursor 3000

# Everything runs fullscreen; beamshell is the only client.
for_window [title=".*"] fullscreen enable

# Escape hatches (Ctrl+Alt+F2 back to GNOME also works — VT switching is native).
bindsym Ctrl+Alt+q exit
bindsym Ctrl+Alt+BackSpace exit

exec /usr/local/libexec/beamshell/beamshell-kiosk.sh
